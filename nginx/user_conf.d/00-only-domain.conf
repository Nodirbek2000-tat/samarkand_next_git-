# Sayt faqat https://mentadbirkor.uz manzilida ochiladi. Server IP yoki boshqa nom bilan kelgan so‘rovga
# sayt berilmaydi. (Bu faylda sertifikat yo‘q — nginx-certbot uni tegmay qoldiradi.)

# HTTPS: tanilmagan nom bilan (masalan https://IP) kelgan ulanish TLS bosqichidayoq rad etiladi
server {
    listen 443 ssl default_server reuseport;
    listen [::]:443 ssl default_server reuseport;
    http2 on;
    ssl_reject_handshake on;
}

# HTTP: IP manzil bilan kelgan so‘rov javobsiz yopiladi. Domen bilan kelgani image ichidagi
# redirector.conf ga tushadi: Let’s Encrypt tekshiruvi (ACME) va HTTPS ga 301.
server {
    listen 80;
    listen [::]:80;
    server_name "~^[0-9.]+$" "~^\[";
    return 444;
}
