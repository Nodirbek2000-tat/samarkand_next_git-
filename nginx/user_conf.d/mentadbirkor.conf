# mentadbirkor.uz — Next.js sayt + Django API bitta HTTPS manzil ostida.
#
# SSL: jonasal/nginx-certbot quyidagi bloklardagi har bir server_name uchun
# /etc/letsencrypt/live/mentadbirkor.uz/ sertifikatini o‘zi oladi, har 12 soatda tekshirib yangilaydi
# (docker-compose.yml: RENEWAL_INTERVAL) va nginx ni qayta yuklaydi.
# 80-port (HTTP) va ACME tekshiruvi image ichidagi redirector.conf da — hammasi HTTPS ga yo‘naltiriladi.
# IP orqali kirish 00-only-domain.conf da yopilgan.

# Docker ichki DNS: konteynerlar qayta yaratilsa ham yangi IP topiladi (502 bo‘lmaydi)
resolver 127.0.0.11 valid=10s ipv6=off;

# Next.js statik fayllari (/_next/static — nomida hash bor, hech qachon o‘zgarmaydi) va optimallashtirilgan
# rasmlar (/_next/image) nginx diskida keshlanadi: takroriy so‘rovlar Node serverga bormaydi.
proxy_cache_path /var/cache/nginx/next levels=1:2 keys_zone=next:20m max_size=1g inactive=30d use_temp_path=off;
# /_next/image brauzer qaysi formatni qabul qilishiga qarab AVIF/WebP beradi — kesh kaliti ham shunga qarab
map $http_accept $img_format {
    default        "";
    "~image/avif"  "avif";
    "~image/webp"  "webp";
}

# Sahifalar keshi (location / ga qarang): har bir sahifa nginx xotirasida 10 soniya turadi. Next.js bitta
# yadroda ishlaydi — sinovda ~40 so‘rov/s da sahifalar 5 soniyagacha cho‘zildi; endi 500 kishi kirsa ham
# har bir sahifa uchun Next.js ga 10 soniyada bitta so‘rov boradi, qolganlar tayyor nusxani darhol oladi.
proxy_cache_path /var/cache/nginx/pages levels=1:2 keys_zone=pages:20m max_size=512m inactive=10m use_temp_path=off;
# brauzerlar Accept-Encoding ni har xil yozadi — orqadagi serverga faqat ikki xil ketadi (gzip yoki yo‘q),
# shunda keshdagi siqilgan nusxa hammaga yaraydi va har safar qayta siqilmaydi
map $http_accept_encoding $upstream_gzip {
    default   "";
    "~*gzip"  "gzip";
}
# qoralama ko‘rinishi (Next.js draft mode) hech qachon keshdan berilmaydi va keshga yozilmaydi
map $cookie___prerender_bypass $page_nocache {
    default  1;
    ""       0;
}
# qidiruv API: bitta manzildan sekundiga 10 ta (+30 zaxira) — botlar uchun to‘siq; mobil operatorlarda
# ko‘p odam bitta IP dan chiqadi, shuning uchun chegara keng. Server o‘zi va ichki tarmoq cheklanmaydi.
geo $search_limited {
    default         1;
    127.0.0.0/8     0;
    10.0.0.0/8      0;
    172.16.0.0/12   0;
    192.168.0.0/16  0;
}
map $search_limited $search_limit_key {
    0  "";
    1  $binary_remote_addr;
}
limit_req_zone $search_limit_key zone=search:10m rate=10r/s;

# www → asosiy domen
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name www.mentadbirkor.uz;

    ssl_certificate         /etc/letsencrypt/live/mentadbirkor.uz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/mentadbirkor.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mentadbirkor.uz/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;

    return 301 https://mentadbirkor.uz$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    # HTTP/3 (QUIC, UDP 443): yangi ulanish bitta aylanishda ochiladi, paket yo‘qolsa ham qolganlari kutib
    # turmaydi — sekin va beqaror mobil internetda sezilarli tezroq. Brauzer Alt-Svc dan bilib oladi.
    listen 443 quic reuseport;
    listen [::]:443 quic reuseport;
    http2 on;
    server_name mentadbirkor.uz;

    ssl_certificate         /etc/letsencrypt/live/mentadbirkor.uz/fullchain.pem;
    ssl_certificate_key     /etc/letsencrypt/live/mentadbirkor.uz/privkey.pem;
    ssl_trusted_certificate /etc/letsencrypt/live/mentadbirkor.uz/chain.pem;
    ssl_dhparam             /etc/letsencrypt/dhparams/dhparam.pem;
    # qayta kirgan mehmon uchun TLS ulanishi qisqaroq (sessiya bir kun eslab qolinadi)
    ssl_session_cache   shared:mentadbirkor_tls:10m;
    ssl_session_timeout 1d;

    # video yuklash (500 MB gacha) uchun
    client_max_body_size 550m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    # text/x-component — Next.js sahifa ma’lumotlari (RSC) va havolalarni oldindan yuklash
    gzip_types text/plain text/css text/xml text/javascript text/x-component application/json application/javascript
               application/xml application/manifest+json application/rss+xml image/svg+xml image/x-icon font/ttf font/otf;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Alt-Svc 'h3=":443"; ma=86400' always;
    # HIT / STALE / UPDATING / MISS — javob keshdan kelganmi (keshlanmaydigan manzillarda chiqmaydi)
    add_header X-Cache-Status $upstream_cache_status always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # nginx — birinchi nuqta: mijoz yuborgan soxta X-Forwarded-For ustidan yoziladi
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header Accept-Encoding $upstream_gzip;
    # 47 KB lik bosh sahifa ham diskka tushmasdan xotirada uzatiladi
    proxy_buffer_size 16k;
    proxy_buffers 16 16k;

    set $nextjs http://frontend:3000;
    set $django http://backend:8000;

    # faqat ichki tarmoq uchun: bot backend ga, Django esa Next ga to‘g‘ridan-to‘g‘ri (mentadbirkor tarmog‘i) murojaat qiladi
    location ^~ /api/bot/  { return 404; }
    location ^~ /internal/ { return 404; }

    # yuklangan fayllar va Django statikasi — to‘g‘ridan-to‘g‘ri diskdan
    location ^~ /media/ {
        alias /srv/media/;
        expires 30d;
        access_log off;
    }
    location ^~ /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    # Next.js statik fayllari: bir marta Node dan olinadi, keyin nginx keshidan (deploydan keyin eski
    # fayllar ham keshda turadi — ochiq qolgan sahifalar buzilmaydi)
    location ^~ /_next/static/ {
        proxy_pass $nextjs;
        proxy_cache next;
        proxy_cache_key "$host$request_uri|$upstream_gzip";
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        access_log off;
    }
    # optimallashtirilgan rasmlar: har bir o‘lcham va format bir marta tayyorlanadi
    location ^~ /_next/image {
        proxy_pass $nextjs;
        proxy_cache next;
        proxy_cache_key "$host$request_uri$img_format";
        # format kalitda bor: brauzerlarning har xil Accept qatori keshni qayta-qayta almashtirmasin
        proxy_ignore_headers Vary;
        proxy_cache_valid 200 30d;
        proxy_cache_lock on;
        access_log off;
    }

    # qidiruv hamma uchun bir xil (faqat e’lon qilingan ma’lumot): bir xil so‘rov 30 soniya keshdan
    location ^~ /api/search {
        proxy_pass $django;
        limit_req zone=search burst=30 nodelay;
        limit_req_status 429;
        proxy_cache pages;
        proxy_cache_key "search|$request_uri|$upstream_gzip";
        # cookie qo‘yadigan javob (Set-Cookie) baribir keshlanmaydi
        proxy_ignore_headers Cache-Control Expires Vary;
        proxy_cache_valid 200 30s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_lock on;
    }
    location ^~ /api/ {
        proxy_pass $django;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ /django-admin/ {
        proxy_pass $django;
    }

    # kirish cookie siga bog‘liq sahifalar (proxy.ts) hech qachon umumiy keshdan berilmaydi
    location ~ ^/(admin|kabinet|kirish)(/|$) {
        proxy_pass $nextjs;
        proxy_read_timeout 60s;
    }

    # Sahifalar: 10 soniyalik umumiy kesh. HTML hamma uchun bir xil (kim kirgani brauzerda so‘raladi), shuning
    # uchun Next.js ning "private, no-store" belgisiga qaramay keshlanadi. Muddati o‘tgan nusxa yangisi orqada
    # tayyorlanguncha beriladi — hech kim Next.js ni kutib qolmaydi; Next.js ishdan chiqsa ham sayt ochiladi.
    # Admin o‘zgartirgan matn saytda ko‘pi bilan ~10 soniyada ko‘rinadi.
    location / {
        proxy_pass $nextjs;
        proxy_read_timeout 60s;
        proxy_cache pages;
        # sahifaning HTML va RSC (sahifalar orasida o‘tish) variantlari alohida; _rsc parametri request_uri da
        proxy_cache_key "$host$request_uri|$http_rsc|$http_next_router_prefetch|$http_next_router_segment_prefetch|$http_next_router_state_tree|$http_next_url|$upstream_gzip";
        # X-Accel-Buffering ham e’tiborsiz: kesh uchun javob to‘liq yig‘iladi (Set-Cookie li javob keshlanmaydi)
        proxy_ignore_headers Cache-Control Expires Vary X-Accel-Buffering;
        proxy_cache_valid 200 404 10s;
        proxy_cache_use_stale updating error timeout http_500 http_502 http_503 http_504;
        proxy_cache_background_update on;
        proxy_cache_lock on;
        proxy_cache_lock_timeout 5s;
        proxy_cache_bypass $page_nocache;
        proxy_no_cache $page_nocache;
    }
}
