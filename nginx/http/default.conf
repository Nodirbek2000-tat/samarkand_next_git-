# HTTP rejimi: domen va SSL hali yo‘q — sayt server IP orqali ochiladi (http://173.249.39.129).
# docker-compose.http.yml shu faylni oddiy nginx ga ulaydi. Domen ishlagach SSL rejimiga qayting (DEPLOY.md).

resolver 127.0.0.11 valid=10s ipv6=off;

server {
    listen 80 default_server;
    server_name _;

    client_max_body_size 550m;
    client_body_timeout 300s;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Host $host;

    set $nextjs http://frontend:3000;
    set $django http://backend:8000;

    # faqat ichki tarmoq uchun
    location ^~ /api/bot/  { return 404; }
    location ^~ /internal/ { return 404; }

    location ^~ /media/ {
        alias /srv/media/;
        expires 30d;
        access_log off;
    }
    location ^~ /static/ {
        alias /srv/static/;
        expires 30d;
        access_log off;
    }

    location ^~ /api/ {
        proxy_pass $django;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
    }
    location ^~ /django-admin/ {
        proxy_pass $django;
    }

    location / {
        proxy_pass $nextjs;
        proxy_read_timeout 60s;
    }
}
